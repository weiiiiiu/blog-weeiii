<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 400" style="background:#ffffff;max-width:900px;" role="img" aria-labelledby="adv-title adv-desc">
<title id="adv-title">进阶：三个玩法插在哪</title>
<desc id="adv-desc">LoRA 插在模型连线上，ControlNet 用参考图经预处理器注入采样器，放大是出图后再走一遍低降噪精修。</desc>
<style>
  .box{fill:#f2f5f8;stroke:#596675;stroke-width:1.5px;}
  .box-hl{fill:#e3f0f7;stroke:#2f6f8f;stroke-width:2px;}
  .t{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;font-size:16px;font-weight:bold;fill:#17212d;text-anchor:middle;}
  .s{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;font-size:13px;fill:#4a5a6a;text-anchor:middle;}
  .rl{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;font-size:16px;font-weight:bold;fill:#596675;}
  .title{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;font-size:22px;font-weight:bold;fill:#17212d;text-anchor:middle;}
  .note{font-family:Arial,PingFang SC,Microsoft YaHei,sans-serif;font-size:16px;fill:#596675;text-anchor:middle;}
  .arrow{stroke:#596675;stroke-width:2px;fill:none;}
</style>
<defs>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#596675"/>
  </marker>
</defs>

<text class="title" x="450" y="28">进阶：三个玩法插在哪</text>

<text class="rl" x="20" y="44">LoRA —— 插在模型连线上</text>
<g>
  <rect class="box" x="20" y="54" width="190" height="56" rx="10"/>
  <text class="t" x="115" y="78">Load Checkpoint</text>
  <text class="s" x="115" y="98">底模型</text>
  <rect class="box-hl" x="235" y="54" width="190" height="56" rx="10"/>
  <text class="t" x="330" y="78">LoraLoader</text>
  <text class="s" x="330" y="98">强度 0.6–0.9</text>
  <rect class="box" x="450" y="54" width="190" height="56" rx="10"/>
  <text class="t" x="545" y="78">KSampler</text>
  <text class="s" x="545" y="98">去噪出图</text>
  <text class="note" x="760" y="84">提示词加触发词</text>
  <path class="arrow" d="M210 82 H235" marker-end="url(#ah)"/>
  <path class="arrow" d="M425 82 H450" marker-end="url(#ah)"/>
</g>

<text class="rl" x="20" y="164">ControlNet —— 参考图控构图</text>
<g>
  <rect class="box" x="20" y="174" width="190" height="56" rx="10"/>
  <text class="t" x="115" y="198">参考图</text>
  <text class="s" x="115" y="218">一张图定构图</text>
  <rect class="box" x="235" y="174" width="190" height="56" rx="10"/>
  <text class="t" x="330" y="198">预处理器</text>
  <text class="s" x="330" y="218">抠轮廓 · 深度 · 姿态</text>
  <rect class="box-hl" x="450" y="174" width="190" height="56" rx="10"/>
  <text class="t" x="545" y="198">ControlNetApply</text>
  <text class="s" x="545" y="218">强度 0.5–0.8</text>
  <rect class="box" x="665" y="174" width="190" height="56" rx="10"/>
  <text class="t" x="760" y="198">KSampler</text>
  <text class="s" x="760" y="218">去噪出图</text>
  <path class="arrow" d="M210 202 H235" marker-end="url(#ah)"/>
  <path class="arrow" d="M425 202 H450" marker-end="url(#ah)"/>
  <path class="arrow" d="M640 202 H665" marker-end="url(#ah)"/>
</g>

<text class="rl" x="20" y="284">放大 —— 两段式出高清</text>
<g>
  <rect class="box" x="20" y="294" width="190" height="56" rx="10"/>
  <text class="t" x="115" y="318">KSampler 出图</text>
  <text class="s" x="115" y="338">中等分辨率</text>
  <rect class="box" x="235" y="294" width="190" height="56" rx="10"/>
  <text class="t" x="330" y="318">放大 ×2</text>
  <text class="s" x="330" y="338">Upscale Image</text>
  <rect class="box" x="450" y="294" width="190" height="56" rx="10"/>
  <text class="t" x="545" y="318">VAE Encode</text>
  <text class="s" x="545" y="338">回潜空间</text>
  <rect class="box-hl" x="665" y="294" width="190" height="56" rx="10"/>
  <text class="t" x="760" y="318">KSampler</text>
  <text class="s" x="760" y="338">denoise 0.3–0.5</text>
  <path class="arrow" d="M210 322 H235" marker-end="url(#ah)"/>
  <path class="arrow" d="M425 322 H450" marker-end="url(#ah)"/>
  <path class="arrow" d="M640 322 H665" marker-end="url(#ah)"/>
</g>
</svg>
